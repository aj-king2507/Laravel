<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Login - Opal Glow</title>
        <meta name="author" content="Heena"/>
        <meta name="keywords" content="Opal Glow, Beauty Salon, Skin care, Hair spa, Body care, Mauritius, Glow treatment"/>
        <meta name="description" content="Opal Glow beauty salon offers premium skin, hair and body care treatments to help you look and feel your glowing best."/>
        <meta charset="utf-8"/>
        <meta name="robots" content="index, follow, archive"/>
        <link rel="stylesheet" href="login.css">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
</head>

<body>
    <div class="split-container">
        <div class="left-side">
        <img src="login_image.jpeg" alt="Opal Glow spa setting with candles, towel, orchid and water droplets">
</div>

<div class="right-side">
    <div class="back-home">
            <a href="homepage.html">&larr; Homepage</a>
</div>

<h2 class="title">Welcome Back</h2>
<p class="subtitle">Log In To Continue Your Glow Journey.</p>

<form action="#" method="POST" class="login-form" id="loginForm" novalidate>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <small id="emailError" style="color:red;"></small>

    <label for="pwd">Password</label>
    <input type="password" id="pwd" name="pwd" required>
    <small id="pwdError" style="color:red;"></small>

    <button type="submit" class="login-btn">Login</button>
</form>
<p class="register-text">
    Don't have an account? <a href="register.html">Register</a>
</p>

</div>

<!-- jQuery -->
 <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Live Validation -->
  <script>
    $(document).ready(function(){

        $("#loginForm input").on("keyup", function(){

        let email = $("#email").val().trim();
        let password = $("#pwd").val();

        //EMAIL CHECK 
        let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

        if(email === ""){
            $("#emailError").text("Email is required");
        } else if(!email.match(emailPattern)){
            $("#emailError").text("Email must be in the format: name@example.com");
        } else {
            $("#emailError").text("");
        }

        //PASSWORD CHECK 
        if(password === ""){
            $("#pwdError").text("Password is required")
        } else {
            $("#pwdError").text("");
        }

    });

    //PREVENT FORM SUBMISSION
    $("#loginForm").submit(function(e){

        let email = $("#email").val().trim();
        let password = $("#pwd").val();

        let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

        if(
            email === "" ||
            !email.match(emailPattern) ||
            password === "" 
        ){
            e.preventDefault(); //stop form submission
        }

    });


    });

  </script>

</body>
</html>
